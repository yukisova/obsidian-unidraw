<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unidraw — preview</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body class="theme-dark">
    <div class="demo-window">
      <div class="demo-chrome">
        <div class="demo-traffic" aria-hidden="true">
          <span class="demo-light is-red"></span>
          <span class="demo-light is-yellow"></span>
          <span class="demo-light is-green"></span>
        </div>
        <div class="demo-brand">
          <span class="demo-brand-mark">◈</span>
          <span class="demo-brand-name">Obsidian</span>
          <span class="demo-brand-slash">/</span>
          <span class="demo-brand-vault">demo vault</span>
        </div>
        <div class="demo-tab">
          <span class="demo-tab-icon">◫</span>
          <span class="demo-tab-label">unidraw-demo.unidraw</span>
          <span class="demo-tab-dot"></span>
        </div>
        <div class="demo-chrome-spacer"></div>
        <div class="demo-badge">UNIDRAW · PREVIEW</div>
      </div>
      <div id="app" class="demo-app"></div>
    </div>
    <script src="./dist/demo.js"></script>
  </body>
</html>
